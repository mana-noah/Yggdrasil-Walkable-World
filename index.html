<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yggdrasil — Walkable World</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <div id="scene" class="scene station">
    <div class="sky"></div>
    <div class="horizon"></div>
    <div class="place-sign" id="placeSign">ノスタルジア駅</div>
    <div class="world">
      <div class="building theater-building" id="theaterVisual"></div>
      <div class="road"></div>
      <div class="path-label" id="pathLabel">追憶劇場はこちら</div>
      <div class="player" id="player" aria-label="プレイヤー"></div>
    </div>
  </div>

  <aside class="hud">
    <div class="title">YGGDRASIL</div>
    <div class="subtitle">WALKABLE WORLD — PROTOTYPE</div>
    <div id="status">ノスタルジア駅</div>
    <div id="message">駅を出て、追憶劇場へ向かう。</div>
    <div class="controls">
      <button data-dir="up" aria-label="上へ">↑</button>
      <div><button data-dir="left" aria-label="左へ">←</button><button data-dir="down" aria-label="下へ">↓</button><button data-dir="right" aria-label="右へ">→</button></div>
    </div>
    <div class="keys">矢印キー / WASD　移動　・　E　調べる</div>
  </aside>

  <div id="interaction" class="interaction hidden">
    <div id="interactionTitle"></div>
    <p id="interactionText"></p>
    <button id="continue">進む</button>
  </div>

  <div id="fade"></div>
</div>
<script src="script.js"></script>
</body>
</html>
